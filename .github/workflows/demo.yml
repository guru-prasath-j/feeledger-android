name: Emulator demo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build app and test APKs
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run walkthrough on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash scripts/demo-capture.sh

      - name: Commit screenshots to main
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "docs: refresh emulator walkthrough screenshots [skip ci]" || echo "No changes"
          git push

      - name: Publish raw outputs to demo-output branch
        if: always()
        run: |
          mkdir -p /tmp/out
          cp -r docs /tmp/out/ 2>/dev/null || true
          cp instrument.txt logcat.txt /tmp/out/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan demo-output
          git rm -rf -q . || true
          cp -r /tmp/out/. .
          git add -A
          git commit -m "Emulator demo output for ${GITHUB_SHA::7} [skip ci]" || true
          git push -f origin demo-output
